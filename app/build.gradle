plugins {
    alias(libs.plugins.android.application)
}

def computeVersionCode(String name) {
    try {
        def parts = name.tokenize('.')
        int major = parts.size() > 0 ? parts[0].toInteger() : 1
        int minor = parts.size() > 1 ? parts[1].toInteger() : 0
        int patch = parts.size() > 2 ? parts[2].toInteger() : 0
        return major * 10000 + minor * 100 + patch
    } catch (Exception e) {
        return 10000
    }
}

def resolveVersionName = { ->
    if (project.hasProperty('versionName')) {
        return project.property('versionName').toString()
    }
    try {
        def gitTag = 'git describe --tags --exact-match'.execute().text.trim()
        if (gitTag.startsWith('v')) {
            return gitTag.substring(1)
        }
    } catch (Exception ignored) {}
    def changelog = rootProject.file('CHANGELOG.md')
    if (changelog.exists()) {
        def match = changelog.text =~ /##\s*\[([0-9]+(?:\.[0-9]+)*)\]/
        if (match.find()) {
            return match.group(1)
        }
    }
    return "1.0.0"
}

def appVersionName = resolveVersionName()
def appVersionCode = project.hasProperty('versionCode') ? 
    project.property('versionCode').toInteger() : 
    computeVersionCode(appVersionName)

android {
    namespace 'com.budjet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mhrahmankwoshik.bongo_budget"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            if (file('release.jks').exists()) {
                storeFile file('release.jks')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'bongobudget'
                keyAlias System.getenv("KEY_ALIAS") ?: 'bongo'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'bongobudget'
            }
        }
    }

    buildTypes {
        release {
            if (file('release.jks').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    
    // Lifecycle & MVVM
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // JSON
    implementation libs.gson

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
