plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.budjet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.budjet.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            if (file('release.jks').exists()) {
                storeFile file('release.jks')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'bongobudget'
                keyAlias System.getenv("KEY_ALIAS") ?: 'bongo'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'bongobudget'
            }
        }
    }

    buildTypes {
        release {
            if (file('release.jks').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    
    // Lifecycle & MVVM
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    
    // Room
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // JSON
    implementation libs.gson

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
